[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sedumipy"
version = "0.0.1.dev0"
description = "MATLAB/Octave-free port of SeDuMi (work in progress)"
readme = "README.md"
license = { text = "GPL-2.0-only" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/napinoco/sedumipy"
Repository = "https://github.com/napinoco/sedumipy"
Issues = "https://github.com/napinoco/sedumipy/issues"

[project.optional-dependencies]
test = ["pytest>=7.0"]
docs = ["sphinx>=7.0", "furo", "myst-parser"]

[tool.pytest.ini_options]
markers = [
    "mini: fastest handful of tests/test_benchmarks.py's SDPLIB/DIMACS problems, safe to run on every commit",
    "timing: tests/test_benchmarks.py problems this port solves in well under a minute",
    "extended: slow tests/test_benchmarks.py problems (DIMACS copo23, hamming_9_8, TORUS) -- minutes, not for routine runs",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sedumipy*"]

# Verified in .github/workflows/wheels.yml (Linux manylinux via
# cibuildwheel's own containers, and macOS -- both run for real on
# GitHub Actions). Windows is excluded on purpose, not just untested:
# tools/build_libsedumi.sh is a bash script invoked via subprocess.run()
# from setup.py's BuildLibsedumi step, and there is no cl.exe/MSVC
# equivalent of it yet (see CONTRIBUTING.md's Phase 6 note).
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *_i686 *-win32 *-win_amd64 *-win_arm64"
test-command = "python -c \"import sedumipy, numpy as np; x,y,info = sedumipy.sedumi(np.eye(2), np.array([1.0,1.0]), np.array([1.0,1.0]), {'l':2}); assert info['numerr']==0\""

[tool.cibuildwheel.linux]
# manylinux containers are yum/dnf-based (AlmaLinux); libsedumi.so only
# needs BLAS (see tools/build_libsedumi.sh), not LAPACK.
before-all = "yum install -y blas-devel || apt-get install -y libblas-dev"

# No [tool.cibuildwheel.macos] before-all: tools/build_libsedumi.sh links
# against the system Accelerate framework on Darwin, so nothing needs
# installing there.
