[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sedumipy"
version = "0.0.1.dev0"
description = "MATLAB/Octave-free port of SeDuMi (work in progress)"
readme = "README.md"
license = { text = "GPL-2.0-only" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/napinoco/sedumipy"
Repository = "https://github.com/napinoco/sedumipy"
Issues = "https://github.com/napinoco/sedumipy/issues"

[project.optional-dependencies]
test = ["pytest>=7.0"]
docs = ["sphinx>=7.0", "furo", "myst-parser"]

[tool.pytest.ini_options]
markers = [
    "mini: fastest handful of tests/test_benchmarks.py's SDPLIB/DIMACS problems, safe to run on every commit",
    "timing: tests/test_benchmarks.py problems this port solves in well under a minute",
    "extended: slow tests/test_benchmarks.py problems (DIMACS copo23, hamming_9_8, TORUS) -- minutes, not for routine runs",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sedumipy*"]

# Verified in .github/workflows/wheels.yml -- Linux (manylinux, via
# cibuildwheel's own containers), macOS (Accelerate framework), and
# Windows (MSYS2 MinGW64 + OpenBLAS, repaired with delvewheel) all build
# for real on GitHub Actions. win_arm64 stays skipped: MSYS2's
# mingw-w64-x86_64-openblas package is x86_64-only.
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *_i686 *-win32 *-win_arm64"
test-command = "python -c \"import sedumipy, numpy as np; x,y,info = sedumipy.sedumi(np.eye(2), np.array([1.0,1.0]), np.array([1.0,1.0]), {'l':2}); assert info['numerr']==0\""

[tool.cibuildwheel.linux]
# manylinux containers are yum/dnf-based (AlmaLinux); libsedumi.so only
# needs BLAS (see tools/build_libsedumi.sh), not LAPACK.
before-all = "yum install -y blas-devel || apt-get install -y libblas-dev"
# cibuildwheel 2.x's default manylinux image is still manylinux2014;
# recent numpy/scipy releases have dropped wheel support for it, so the
# test-command step's `pip install` (numpy/scipy come from sedumipy's
# own [project.dependencies], not built here) fell back to building
# scipy from source -- which then failed for the unrelated reason that
# this bare container has no OpenBLAS for *scipy's* build, only the
# blas-devel/libblas-dev installed above for libsedumi.so itself.
# manylinux_2_28 has current numpy/scipy wheels available and is still
# yum/dnf-based, so `before-all` above needs no change.
manylinux-x86_64-image = "manylinux_2_28"

# No [tool.cibuildwheel.macos] before-all: tools/build_libsedumi.sh links
# against the system Accelerate framework on Darwin, so nothing needs
# installing there.

[tool.cibuildwheel.windows]
# .github/workflows/wheels.yml's Windows job installs MSYS2 (bash, gcc,
# openblas) and puts it on PATH before cibuildwheel runs, so
# setup.py's `bash tools/build_libsedumi.sh` step (see setup.py's own
# Windows note) can find them. The built libsedumi.dll dynamically
# depends on libopenblas.dll and mingw's runtime DLLs, none of which are
# on a plain end user's machine, so `delvewheel repair` bundles them
# into the wheel -- the same role auditwheel/delocate play on
# Linux/macOS, just not one of cibuildwheel's own built-in defaults for
# Windows.
before-build = "pip install delvewheel"
# --analyze-existing is required here, not optional: delvewheel only
# analyzes a wheel's *extension modules* (.pyd) by default, and this
# wheel has none -- libsedumi.dll is a plain ctypes-loaded DLL (see
# setup.py's docstring), so without this flag delvewheel finds nothing
# to analyze and reports "no external dependencies are needed",
# bundling nothing at all. That was not a sign the library is
# self-contained: it links -lopenblas against MSYS2's libopenblas.dll.a
# import library (see tools/build_libsedumi.sh), so libopenblas.dll and
# the mingw runtime DLLs really are dynamic dependencies, and a wheel
# without them fails to load on any machine that doesn't happen to have
# MSYS2 installed.
#
# C:\toolchain-mingw64\mingw64\bin (not C:\msys64\mingw64\bin): see
# wheels.yml's "Verify MSYS2 gcc/openblas, then copy it out of C:\msys64"
# step -- the build itself resolves gcc from the copy via MSYS2_ROOT, so
# the DLLs delvewheel needs to bundle live there too, not in the
# original MSYS2 install.
repair-wheel-command = "delvewheel repair --analyze-existing --add-path C:\\toolchain-mingw64\\mingw64\\bin;C:\\msys64\\usr\\bin -w {dest_dir} {wheel}"
