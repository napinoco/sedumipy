[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sedumipy"
version = "0.0.1.dev0"
description = "MATLAB/Octave-free port of SeDuMi (work in progress)"
license = { text = "GPL-2.0-only" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
markers = [
    "mini: fastest handful of tests/test_benchmarks.py's SDPLIB/DIMACS problems, safe to run on every commit",
    "timing: tests/test_benchmarks.py problems this port solves in well under a minute",
    "extended: slow tests/test_benchmarks.py problems (DIMACS copo23, hamming_9_8, TORUS) -- minutes, not for routine runs",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sedumipy*"]

# Phase 6: not yet run in real CI in this environment (no Docker daemon
# available to invoke cibuildwheel's manylinux containers here) -- this
# is a starting configuration, validated only indirectly via `python -m
# build --wheel` on this same Linux host (see CONTRIBUTING.md's Phase 6
# note for what that did and didn't confirm). Only Linux is listed;
# macOS/Windows builds need setup.py's BuildLibsedumi step ported off
# tools/build_libsedumi.sh's gcc-only, Linux/macOS-`.so`/`.dylib`-only
# assumptions first (Windows especially -- there is no build_libsedumi.sh
# equivalent for cl.exe yet).
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *_i686 *-win32"
before-all = "yum install -y blas-devel lapack-devel || apt-get install -y libblas-dev liblapack-dev"
test-command = "python -c \"import sedumipy, numpy as np; x,y,info = sedumipy.sedumi(np.eye(2), np.array([1.0,1.0]), np.array([1.0,1.0]), {'l':2}); assert info['numerr']==0\""
