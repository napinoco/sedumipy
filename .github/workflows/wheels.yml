name: wheels

# Builds and (optionally) tests-installs wheels via cibuildwheel -- see
# pyproject.toml's [tool.cibuildwheel] for the actual build/test config.
# Linux runs manylinux containers (real Docker), macOS runs on a real
# Mac, and Windows runs on a real Windows box with MSYS2 installed below
# -- all three provided by GitHub Actions. This is the actual
# verification CONTRIBUTING.md's Phase 6 note flagged as not yet done in
# earlier development (no Docker/macOS/Windows available there).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "csrc/**"
      - "src/**"
      - "tools/build_libsedumi.sh"
      - "setup.py"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
  pull_request:
    paths:
      - "csrc/**"
      - "src/**"
      - "tools/build_libsedumi.sh"
      - "setup.py"
      - "pyproject.toml"
      - ".github/workflows/wheels.yml"
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.21
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Without this, mingw-w64-x86_64-gcc's freshly-extracted .exe/.dll
      # files (a compiler toolchain is hundreds of small, unsigned
      # binaries) can end up silently removed by Windows Defender's
      # real-time scanning before anything gets a chance to use them --
      # confirmed in ci.yml's test-windows job: pacman's own install log
      # said "installing mingw-w64-x86_64-gcc..." successfully, yet
      # `C:\msys64\mingw64\bin` came back completely empty later in the
      # very same job.
      - name: Disable Windows Defender real-time scanning
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-openblas
      # Disabling Defender didn't fix it either: mingw64/bin still came
      # back completely empty afterward (confirmed in ci.yml's
      # test-windows job). The setup-msys2 action's own package cache
      # (same cache key across every run so far, always reporting
      # "Cache unchanged, skipping save") is the remaining suspect --
      # pacman's local DB can end up saying a package is installed
      # without its files actually having been restored/extracted.
      # `shell: msys2 {0}` is the action's own supported way to run
      # commands inside the environment (unlike our raw `bash`
      # invocations elsewhere, which have had their own PATH/mount
      # surprises) -- use it to verify directly and force a real
      # reinstall if anything is missing.
      - name: Verify (or force-reinstall) MSYS2 gcc/openblas
        shell: msys2 {0}
        run: |
          if [ ! -x /mingw64/bin/gcc.exe ] || [ ! -f /mingw64/lib/libopenblas.dll.a ]; then
            echo "gcc.exe/libopenblas missing after setup-msys2's install -- forcing a real reinstall"
            pacman -Rns --noconfirm mingw-w64-x86_64-gcc mingw-w64-x86_64-openblas 2>&1 || true
            pacman -S --noconfirm --needed --overwrite '*' mingw-w64-x86_64-gcc mingw-w64-x86_64-openblas
          fi
          ls -la /mingw64/bin/gcc.exe /mingw64/lib/libopenblas.dll.a
          /mingw64/bin/gcc.exe --version
      # cibuildwheel spawns its own subprocesses (pip, setup.py, ...)
      # outside of an MSYS2 shell, so bash/gcc/openblas need to be on the
      # regular Windows PATH, not just the `shell: msys2 {0}` steps the
      # action above sets up for.
      - name: Put MSYS2 on PATH
        shell: bash
        run: |
          echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"
          echo "C:\msys64\usr\bin" >> "$GITHUB_PATH"
      - uses: pypa/cibuildwheel@v2.21
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-latest
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-to-release:
    if: github.event_name == 'release'
    needs: [build, build-windows, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
