name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # No submodules checked out here on purpose: the committed
    # tests/fixtures/*.mat oracle data is enough to run the real test
    # suite (see CONTRIBUTING.md section 8) without Octave or the
    # vendor/examples submodules. Tests that do need a submodule
    # (test_matio.py's gzip case, test_golden_end_to_end.py) skip
    # themselves via pytest.mark.skipif when it's absent.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libblas-dev
      - run: pip install -e .[test]
      - run: python -m pytest tests/ -q

  test-windows:
    # Separate from the `test` matrix above: needs MSYS2 (bash/gcc/
    # openblas) on PATH first so `pip install -e .[test]` can build
    # libsedumi.dll -- see setup.py's and tools/build_libsedumi.sh's
    # Windows notes.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Without this, mingw-w64-x86_64-gcc's freshly-extracted .exe/.dll
      # files (a compiler toolchain is hundreds of small, unsigned
      # binaries) can end up silently removed some time after being
      # written -- confirmed: a `shell: msys2 {0}` verify step placed
      # right after setup-msys2's install finds gcc.exe present and
      # working (near-instant, `gcc --version` succeeds), yet the same
      # path is gone by the time `pip install`'s build_ext step reaches
      # it ~20s later (spent downloading numpy/scipy), after only a
      # plain `Set-MpPreference -DisableRealtimeMonitoring $true`.
      # Strengthen it: also disable behavior monitoring/IOAV/script
      # scanning, add an explicit folder exclusion (belt-and-suspenders
      # in case real-time disable alone doesn't stick), and print
      # Get-MpComputerStatus back so a future run's log actually shows
      # whether any of this took effect.
      - name: Disable Windows Defender scanning of C:\msys64
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -DisableBehaviorMonitoring $true
          Set-MpPreference -DisableBlockAtFirstSeen $true
          Set-MpPreference -DisableIOAVProtection $true
          Set-MpPreference -DisableScriptScanning $true
          Add-MpPreference -ExclusionPath 'C:\msys64'
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled, AMServiceEnabled
          Get-MpPreference | Select-Object DisableRealtimeMonitoring, ExclusionPath
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-openblas
      # `shell: msys2 {0}` is the action's own supported way to run
      # commands inside the environment (unlike our raw `bash`
      # invocations elsewhere, which have had their own PATH/mount
      # surprises) -- use it to verify gcc/openblas are actually there,
      # and force a real reinstall if not (a corrupted package cache
      # entry is a live possibility too: every run so far has hit the
      # same cache key and reported "Cache unchanged, skipping save").
      - name: Verify (or force-reinstall) MSYS2 gcc/openblas
        shell: msys2 {0}
        run: |
          if [ ! -x /mingw64/bin/gcc.exe ] || [ ! -f /mingw64/lib/libopenblas.dll.a ]; then
            echo "gcc.exe/libopenblas missing after setup-msys2's install -- forcing a real reinstall"
            pacman -Rns --noconfirm mingw-w64-x86_64-gcc mingw-w64-x86_64-openblas 2>&1 || true
            pacman -S --noconfirm --needed --overwrite '*' mingw-w64-x86_64-gcc mingw-w64-x86_64-openblas
          fi
          ls -la /mingw64/bin/gcc.exe /mingw64/lib/libopenblas.dll.a
          /mingw64/bin/gcc.exe --version
      - name: Put MSYS2 on PATH
        shell: bash
        run: |
          echo "C:\msys64\mingw64\bin" >> "$GITHUB_PATH"
          echo "C:\msys64\usr\bin" >> "$GITHUB_PATH"
      # Pinpointing diagnostic: the previous verify step (right after
      # setup-msys2) found gcc.exe present, but pip's build_ext step
      # ~20s later (after downloading numpy/scipy) did not. This checks
      # whether it's already gone *before* pip even starts, or vanishes
      # during pip's own run.
      - name: Check gcc.exe right before pip install
        shell: pwsh
        run: |
          if (Test-Path 'C:\msys64\mingw64\bin\gcc.exe') {
            Write-Host "gcc.exe present immediately before pip install"
          } else {
            Write-Host "::warning::gcc.exe ALREADY MISSING before pip install even starts"
          }
      - run: pip install -e .[test]
      - run: python -m pytest tests/ -q

  benchmarks-mini:
    # Separate job: needs the SDPLIB/DIMACS submodules (real published
    # problems + their official optimal values), which the fast `test`
    # job above deliberately skips checking out. `-m mini` keeps this to
    # the fastest ~46-problem subset (~35s solve time) -- see README.md's
    # Benchmarks section for the full/slower marks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libblas-dev
      - run: pip install -e .[test]
      - run: python -m pytest tests/test_benchmarks.py -v -m mini
