[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sedumipy"
version = "0.0.1.dev0"
description = "MATLAB/Octave-free port of SeDuMi (work in progress)"
license = { text = "GPL-2.0-only" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sedumipy*"]
