name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/sedumipy/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

# contents: write, not pages/id-token: this pushes the built site
# straight to the gh-pages branch (JamesIves/github-pages-deploy-action)
# instead of going through the Pages deployment API, so it can coexist
# on that same branch with docs-preview.yml's per-PR subdirectories.
# Requires two one-time manual settings this file can't set itself:
# Settings > Pages > Build and deployment > Source = "Deploy from a
# branch" (gh-pages, / (root)) -- not "GitHub Actions" -- and
# Settings > Actions > General > Workflow permissions = "Read and write
# permissions", so GITHUB_TOKEN can push to that branch.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deliberately not `pip install .[docs]`: that would trigger
      # setup.py's libsedumi.so build step, which needs a C compiler and
      # BLAS/LAPACK dev headers this job doesn't have. docs/conf.py puts
      # src/ on sys.path directly and mocks sedumipy._native, so only
      # the docs' own dependencies are needed to build the docs.
      - run: pip install -r docs/requirements.txt
      # No -W: several ported docstrings use `*`/`'` in ways that read as
      # unterminated RST emphasis (see docs/contributing.rst's note on
      # this) -- cosmetic docutils warnings, not build failures.
      - run: sphinx-build -b html docs docs/_build/html
      # GitHub Pages runs Jekyll by default, which ignores
      # underscore-prefixed paths (_static/, _sources/) that Sphinx's
      # output depends on.
      - run: touch docs/_build/html/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/_build/html
          branch: gh-pages
          # docs-preview.yml (PR previews) commits its own pages under
          # pr-preview/ on this same branch -- excluded here so a
          # main-branch deploy never wipes an in-flight PR preview.
          clean-exclude: pr-preview
          force: false
