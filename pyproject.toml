[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sedumipy"
version = "0.0.1.dev0"
description = "MATLAB/Octave-free port of SeDuMi (work in progress)"
readme = "README.md"
license = { text = "GPL-2.0-only" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/napinoco/sedumipy"
Repository = "https://github.com/napinoco/sedumipy"
Issues = "https://github.com/napinoco/sedumipy/issues"

[project.optional-dependencies]
test = ["pytest>=7.0"]
docs = ["sphinx>=7.0", "furo", "myst-parser"]

[tool.pytest.ini_options]
markers = [
    "mini: fastest handful of tests/test_benchmarks.py's SDPLIB/DIMACS problems, safe to run on every commit",
    "timing: tests/test_benchmarks.py problems this port solves in well under a minute",
    "extended: slow tests/test_benchmarks.py problems (DIMACS copo23, hamming_9_8, TORUS) -- minutes, not for routine runs",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sedumipy*"]

# Verified in .github/workflows/wheels.yml -- Linux (manylinux, via
# cibuildwheel's own containers), macOS, and Windows (MSYS2 MinGW64 for
# the compiler only now) all build for real on GitHub Actions. Linux and
# Windows link scipy-openblas64 (see tools/build_libsedumi.sh) as their
# BLAS instead of a system-package/MSYS2 install -- a pip-installable,
# prebuilt ILP64 OpenBLAS, so `before-build` is a one-line install on
# both rather than two different system-package recipes. macOS keeps
# linking the system Accelerate framework, as before this switch: it
# never had Linux/Windows's build/install pain (Accelerate needs no
# install step at all), so there's nothing here for scipy-openblas64 to
# save -- see build_libsedumi.sh's Darwin case for the full reasoning,
# and its `[tool.cibuildwheel.macos]` section below for the resulting
# no-op `before-build`.
#
# Pinned to an exact version in the `before-build` lines below, not
# left floating: this project's own code computes the mangled BLAS symbol
# names and blasint width from scipy-openblas64's pkg-config metadata
# (see tools/build_libsedumi.sh/csrc/sedumi_platform.h) rather than
# hardcoding them, but an unpinned `pip install` would still let a
# future scipy-openblas64 release change that metadata's shape (or drop
# ILP64, or something else entirely) and silently break every build
# until noticed. Bumping it is a deliberate, tested action -- update
# this same string in .github/workflows/ci.yml, README.md,
# CONTRIBUTING.md and docs/installation.rst together, then re-run the
# full test suite and the SDPLIB/DIMACS mini benchmarks against it
# before pushing.
#
# --no-build-isolation is required for that: scipy-openblas64 is not
# declared in this project's own [build-system] requires (deliberately
# -- it isn't available for every platform `pip install` could target,
# e.g. 32-bit x86/win32, and build_libsedumi.sh falls back to a system
# BLAS there instead), so a normal isolated build would not see the
# copy `before-build` just installed: pip's build isolation runs
# setup.py in a *separate* environment that only contains this
# project's declared build requirements, invisible to `import
# scipy_openblas64` even though it's the same Python interpreter.
# Skipping isolation makes cibuildwheel's own venv (where before-build
# just installed it) the one setup.py actually runs in. macOS overrides
# this back to normal isolation below (see [tool.cibuildwheel.macos]) --
# it is NOT harmless to leave on there: --no-build-isolation also means
# pip won't auto-install this project's own [build-system] requires
# (setuptools>=68) into an isolated env, so without either build
# isolation restored or setuptools installed by some other means, the
# build fails outright with "ModuleNotFoundError: No module named
# 'setuptools'" (confirmed the hard way in CI once before-build stopped
# installing anything on macOS).
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *_i686 *-win32 *-win_arm64"
build-frontend = { name = "pip", args = ["--no-build-isolation"] }
before-build = "pip install setuptools scipy-openblas64==0.3.34.106.0"
test-command = "python -c \"import sedumipy, numpy as np; x,y,info = sedumipy.sedumi(np.eye(2), np.array([1.0,1.0]), np.array([1.0,1.0]), {'l':2}); assert info['numerr']==0\""

[tool.cibuildwheel.linux]
# cibuildwheel 2.x's default manylinux image is still manylinux2014;
# recent numpy/scipy releases have dropped wheel support for it, so the
# test-command step's `pip install` (numpy/scipy come from sedumipy's
# own [project.dependencies], not built here) fell back to building
# scipy from source -- which then failed for the unrelated reason that
# this bare container has no BLAS for *scipy's* own build. manylinux_2_28
# has current numpy/scipy wheels available, sidestepping that.
manylinux-x86_64-image = "manylinux_2_28"
# auditwheel vendors libscipy_openblas64_.so (a shared library the
# global before-build's pip install placed under this venv's own
# site-packages, found via the rpath tools/build_libsedumi.sh links
# with) into the wheel the same way it already vendored -lopenblas
# before this switch -- no extra config needed here for that part.

[tool.cibuildwheel.macos]
# Overrides the global before-build to skip installing scipy-openblas64:
# macOS links the system Accelerate framework instead (see
# build_libsedumi.sh's Darwin case for why), so it would be installed
# only to sit unused -- wasted download/install time on every build, and
# a false impression from reading before-build alone that macOS uses it
# too. "true" is a plain no-op shell command, not a typo.
before-build = "true"
# Also overrides build-frontend back to plain isolated pip (dropping the
# global --no-build-isolation): macOS has nothing for that flag to
# preserve visibility of (no scipy-openblas64 import to protect, per
# above), and a normal isolated build installs this project's own
# [build-system] requires (setuptools>=68) automatically -- which
# before-build no longer does now that it's a no-op. Skipping this
# override left setuptools missing entirely and the build failing with
# "ModuleNotFoundError: No module named 'setuptools'" (confirmed in CI).
build-frontend = "default"
# No repair-wheel-command override needed: delocate (cibuildwheel's
# macOS default) has nothing to vendor here, same as before this switch
# -- Accelerate is a system framework, not a bundled shared library.

[tool.cibuildwheel.windows]
# .github/workflows/wheels.yml's Windows job installs MSYS2 (bash, gcc)
# and puts it on PATH before cibuildwheel runs, so setup.py's `bash
# tools/build_libsedumi.sh` step (see setup.py's own Windows note) can
# find them -- still needed for the compiler even though scipy-openblas64
# now supplies the BLAS (MSVC can't build this, see setup.py's
# WINDOWS_BUILD_HELP). `delvewheel repair` bundles libscipy_openblas64_.dll
# and the mingw runtime DLLs into the wheel, none of which are on a plain
# end user's machine -- the same role auditwheel plays on Linux (macOS
# needs no such vendoring, see [tool.cibuildwheel.macos] above), just
# not one of cibuildwheel's own built-in defaults for Windows.
# tools/repair_windows_wheel.py exists only because the
# scipy-openblas64 DLL's directory (a site-packages path inside this
# venv) has to be resolved in Python at repair time, not hardcoded here.
before-build = "pip install setuptools delvewheel scipy-openblas64==0.3.34.106.0"
repair-wheel-command = "python tools/repair_windows_wheel.py {wheel} {dest_dir}"
